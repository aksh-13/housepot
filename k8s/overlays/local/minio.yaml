# MinIO: an S3-compatible file store, for proof photos, local use only. In production point the
# app at S3 or R2 instead. A folder in MinIO's data directory is a bucket, so the init container
# creating /data/housepot is all the setup the bucket needs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/component: minio
spec:
  selector:
    app.kubernetes.io/component: minio
  ports:
    - name: s3
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  # One disk, one writer: stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: make-bucket
          image: busybox:1.36
          command: ["mkdir", "-p", "/data/housepot"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minio
          # MinIO stopped publishing its own images; this is Chainguard's build of it.
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: housepot-secrets
                  key: S3_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: housepot-secrets
                  key: S3_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
