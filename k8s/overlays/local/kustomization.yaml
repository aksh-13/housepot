# The whole app on a laptop: the base, plus its own Postgres and S3-compatible photo store, with
# texts and payments faked. Dev-only passwords live here in plain sight on purpose; nothing in this
# overlay is ever used outside a local kind cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: housepot

resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - minio.yaml
  - web-nodeport.yaml

images:
  - name: housepot
    newName: housepot
    newTag: dev

configMapGenerator:
  - name: housepot-config
    literals:
      - BASE_URL=http://localhost:8642
      - SMS_PROVIDER=fake
      - PAYMENTS_PROVIDER=fake
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=housepot
      # Plain http on localhost, so the session cookie cannot be marked "secure".
      - INSECURE_COOKIES=1

secretGenerator:
  - name: housepot-secrets
    literals:
      - DATABASE_URL=postgres://postgres:local-dev-only@postgres:5432/housepot
      - POSTGRES_PASSWORD=local-dev-only
      - TICK_SECRET=local-tick-secret
      - S3_ACCESS_KEY_ID=housepot-local
      - S3_SECRET_ACCESS_KEY=local-dev-only-secret
