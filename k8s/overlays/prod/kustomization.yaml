# Production: the base, plus an Ingress for real traffic. The database and photo store are managed
# services reached by URL, so there is no Postgres or MinIO here.
#
# Before applying: copy secret.env.example to secret.env and fill it in (secret.env is gitignored),
# and change the host name in ingress.yaml and BASE_URL below to your domain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: housepot

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

images:
  - name: housepot
    newName: ghcr.io/aksh-13/housepot
    newTag: latest

# The image lives in a private registry, so the pods need a pull secret. Create it once
# (see "Going live" in the README), or make the package public and delete this patch.
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull

configMapGenerator:
  - name: housepot-config
    literals:
      - BASE_URL=https://housepot.example.com
      - SMS_PROVIDER=twilio
      - PAYMENTS_PROVIDER=stripe
      - INBOUND_EMAIL_PROVIDER=webhook
      - INBOUND_EMAIL_DOMAIN=pay.housepot.example
      - STORAGE_PROVIDER=s3
      - S3_REGION=us-east-1
      - S3_BUCKET=housepot

secretGenerator:
  - name: housepot-secrets
    envs:
      - secret.env
